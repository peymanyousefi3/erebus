#VRML_SIM R2025a utf8
# template language: javascript

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/50c3f419b5da49a2af606297049ee91e8adbc92e/projects/objects/apartment_structure/protos/Wall.proto"
EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/50c3f419b5da49a2af606297049ee91e8adbc92e/projects/appearances/protos/CorrodedMetal.proto"
EXTERNPROTO "curvedWall.proto"

PROTO worldTile [
      field SFInt32 xPos 0
      field SFInt32 zPos 0
      field SFBool floor FALSE
      field SFInt32 rightWall 0 # divisible by 2 means shortened on north }, divisble by 3 means shortened on south }
      field SFInt32 bottomWall 0 # divisible by 2 means shortened, divisible by 3 means extended, possible vals 0, 1, 2, 3, 6
	  field SFInt32 topWall 0
	  field SFInt32 leftWall 0
	  field SFBool topExternal FALSE
	  field SFBool leftExternal FALSE
	  field SFBool rightExternal FALSE
	  field SFBool bottomExternal FALSE
	  field SFBool start FALSE
	  field SFBool trap FALSE
	  field SFBool checkpoint FALSE
	  field SFBool swamp FALSE
	  field SFBool contact FALSE
	  field SFBool obstacle FALSE
	  field SFRotation obstacleRotation 0 1 0 2.477
	  field SFVec2f obstacleOffset 0 0
	  field SFFloat width 0.0
	  field SFFloat height 0.0
	  field SFString id ""
	  field SFFloat xScale 1.0
	  field SFFloat zScale 1.0
	  field SFFloat yScale 1.0
	  field SFColor tileColor 0 0 0 #Blue: 0.1 0.1 0.9; Purple: 0.3 0.1 0.6; Red: 0.9 0.1 0.1
	  field SFBool isHalf FALSE
	  field SFInt32 curveDir 0
	  field SFInt32 room 0
]
{
%<
// Preserve the original model geometry precision after template conversion.
function modelNumber(value) {
  return typeof value === "number" ? Number(value.toPrecision(14)) : value;
}
>%

      DEF TILE Solid {
	name "solid%<= modelNumber(fields.id.value) >%"
	  %<
	  let scaleX, scaleY, scaleZ, xStart, zStart, x, z;
	  let wallThickness, wallHeight, tileThickness;
	  let x_shift, z_shift, x_size, z_size, y_size, y_shift;
	  let obs_xoff, obs_yoff;
	  scaleX = fields.xScale.value
	  scaleY = fields.yScale.value
	  scaleZ = fields.zScale.value
	  xStart = -(fields.width.value * (0.3 * scaleX) / 2.0)
	  zStart = -(fields.height.value * (0.3 * scaleZ) / 2.0)
	  x = fields.xPos.value * (0.3 * scaleX) + xStart
	  z = fields.zPos.value * (0.3 * scaleZ) + zStart

	  wallThickness = .025
	  wallHeight = .15
	  tileThickness = .02

	  if (fields.isHalf.value == true) { // half tiles are halved in scale, so must double wall thickness to make it match regular
	  	wallThickness = wallThickness * 2
		wallHeight = wallHeight * 2
		tileThickness = tileThickness * 2
      }

	  >%

	  translation %<= modelNumber(x) >% 0 %<= modelNumber(z) >%
	  contactMaterial "TILE"

      children[
		  DEF TILE_SHAPES_GROUP Group {
			  children [

				%<if (fields.floor.value == true) {
					x_shift = 0
					z_shift = 0
					x_size = .3
					z_size = .3

					if (fields.topExternal.value == true) {
						z_shift = z_shift + wallThickness/2/2
						z_size = z_size -wallThickness/2
					}
					if (fields.bottomExternal.value == true) {
						z_shift = z_shift - wallThickness/2/2
						z_size = z_size -wallThickness/2
					}
					if (fields.leftExternal.value == true) {
						x_shift = x_shift + wallThickness/2/2
						x_size = x_size -wallThickness/2
					}
					if (fields.rightExternal.value == true) {
						x_shift = x_shift - wallThickness/2/2
						x_size = x_size -wallThickness/2
					}


				>%
					%<if (fields.checkpoint.value == false && fields.swamp.value == false && fields.start.value == false && fields.contact.value == false) {>%
						DEF FLOOR Transform {
							translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(-0.085 * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
							children [
								Shape {
									appearance Appearance {
										material Material {
											diffuseColor IS tileColor
										}
									}
									geometry DEF FLOORBOX Box {
										size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(tileThickness * scaleY) >% %<= modelNumber(z_size * scaleZ) >%
									}
									isPickable  FALSE
								}
							]
						}
					%<}>%
					%<if (fields.checkpoint.value == true) {>%
						DEF CHECKPOINT Transform {
							translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(-0.085 * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
									children [
										Shape {
											appearance CorrodedMetal  {
											}
											geometry Box {
												size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(tileThickness * scaleY) >% %<= modelNumber(z_size * scaleZ) >%
											}
											isPickable  FALSE
										}
									]
						}
					%<}>%
					%<if (fields.swamp.value == true) {>%
						DEF FLOOR Transform {
							translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(-0.085 * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
									children [
										Shape {
											appearance Appearance {
												material Material {
													diffuseColor 0.517647 0.392157 0.192157
												}
											}
											geometry Box {
												size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(tileThickness * scaleY) >% %<= modelNumber(z_size * scaleZ) >%
											}
											isPickable  FALSE
										}
									]
						}
					%<}>%
					%<if (fields.contact.value == true) {>%
						DEF FLOOR Transform {
							translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(-0.085 * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
							children [
								Shape {
									appearance Appearance {
										material Material {
											diffuseColor 0 0.635 0.635
										}
									}
									geometry Box {
										size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(tileThickness * scaleY) >% %<= modelNumber(z_size * scaleZ) >%
									}
									isPickable FALSE
								}
							]
						}
					%<}>%
					%<if (fields.start.value == true) {>%
						DEF START Transform {
							translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(-0.085 * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
									children [
										Shape {
											appearance Appearance {
												material Material {
													diffuseColor 0 0 0
													emissiveColor 0.0313 0.835 0.0313
													shininess 0.8
												}

											}
											geometry Box {
												size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(tileThickness * scaleY) >% %<= modelNumber(z_size * scaleZ) >%
											}
											isPickable  FALSE
										}
									]
						}
					%<}>%
				%<}>%
				%<if (fields.rightWall.value > 0) {
					z_size = .3
					z_shift = 0
					y_size = wallHeight
					y_shift = 0

					if (fields.rightWall.value % 2 == 0) {
						z_size = z_size - wallThickness/2
						z_shift = z_shift + wallThickness/2/2
					}
					if (fields.rightWall.value % 3 == 0) {
						z_size = z_size - wallThickness/2
						z_shift = z_shift - wallThickness/2/2
					}
					if (fields.rightExternal.value == true) {
						y_size = wallHeight + tileThickness
						y_shift = -tileThickness/2
					}

				>%
					DEF RIGHTWALL Transform {
						translation %<= modelNumber(.15 * scaleX) >% %<= modelNumber(y_shift * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
						children [
							Shape {
								appearance Appearance {
									material Material {
										diffuseColor 0.2 0.47 0.52
									}
								}
								geometry DEF BACKWALLBOX Box {
								size %<= modelNumber(wallThickness * scaleX) >% %<= modelNumber(y_size * scaleY) >% %<= modelNumber(z_size * scaleY) >%
								}
								isPickable  FALSE
							}
						]
					}
				%<}>%
				%<if (fields.bottomWall.value > 0) {
					x_size = .3
					x_shift = 0
					y_size = wallHeight
					y_shift = 0

					if (fields.bottomWall.value % 2 == 0) {
						x_size = x_size - wallThickness/2
						x_shift = x_shift + wallThickness/2/2
					}
					if (fields.bottomWall.value % 3 == 0) {
						x_size = x_size + wallThickness/2
						x_shift = x_shift + wallThickness/2/2
					}
					if (fields.bottomExternal.value == true) {
						y_size = wallHeight + tileThickness
						y_shift = -tileThickness/2
					}

					if (fields.bottomWall.value % 5 == 0) {
						x_size = x_size + wallThickness/2
						x_shift = x_shift - wallThickness/2/2
					}

				>%
					DEF FRONTWALL Transform {
						translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(y_shift * scaleY) >% %<= modelNumber(.15 * scaleZ) >%
						children [
							Shape {
								appearance Appearance {
									material Material {
										diffuseColor 0.2 0.47 0.52
									}
								}
								geometry DEF BACKWALLBOX Box {
								size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(y_size * scaleY) >% %<= modelNumber(wallThickness * scaleZ) >%
								}
								isPickable  FALSE
							}
						]
					}
					%<if (fields.rightWall.value > 0 && fields.rightExternal.value == true && fields.bottomExternal.value == false) {>%

					Transform {
						translation %<= modelNumber(.15 * scaleX) >% %<= modelNumber((-wallHeight/2-tileThickness/2) * scaleY) >% %<= modelNumber(.15 * scaleZ) >%
						children [
								Shape {
									appearance Appearance {
										material Material {
											diffuseColor 0.2 0.466667 0.521569
										}
									}
									geometry DEF BACKWALLBOX Box {
										size %<= modelNumber(wallThickness * scaleX) >% %<= modelNumber(tileThickness * scaleY) >% %<= modelNumber(wallThickness * scaleZ) >%
									}
									isPickable  FALSE
								}
							]
					}
					%<}>%
				%<}>%
				%<if (fields.topWall.value > 0) {

					x_size = .3
					x_shift = 0
					y_size = wallHeight
					y_shift = 0

					if (fields.topWall.value % 2 == 0) {
						x_size = x_size - wallThickness/2
						x_shift = x_shift + wallThickness/2/2
					}
					if (fields.topWall.value % 3 == 0) {
						x_size = x_size + wallThickness/2
						x_shift = x_shift + wallThickness/2/2
					}
					if (fields.leftWall.value == 1  || fields.leftWall.value == 3) { //special case for top left corner
						x_size = x_size + wallThickness/2
						x_shift = x_shift - wallThickness/2/2
					}
					if (fields.topExternal.value == true) {
						y_size = wallHeight + tileThickness
						y_shift = -tileThickness/2
					}
				>%
					Transform {
						translation %<= modelNumber(x_shift * scaleX) >% %<= modelNumber(y_shift * scaleY) >% %<= modelNumber(-.15 * scaleZ) >%
						children [
								Shape {
									appearance Appearance {
										material Material {
											diffuseColor 0.2 0.466667 0.521569
										}
									}
									geometry DEF BACKWALLBOX Box {
										size %<= modelNumber(x_size * scaleX) >% %<= modelNumber(y_size * scaleY) >% %<= modelNumber(wallThickness * scaleZ) >%
									}
									isPickable  FALSE
								}
							]
					}
				%<}>%
				%<if (fields.leftWall.value > 0) {

					z_size = .3
					z_shift = 0
					y_size = wallHeight
					y_shift = 0

					if (fields.leftWall.value % 2 == 0) {
						z_size = z_size - wallThickness/2
						z_shift = z_shift + wallThickness/2/2
					}
					if (fields.leftWall.value % 3 == 0) {
						z_size = z_size + wallThickness/2
						z_shift = z_shift + wallThickness/2/2
					}
					if (fields.topWall.value == 1 || fields.topWall.value == 3) { //special case for top left corner
						z_size = z_size - wallThickness/2
						z_shift = z_shift + wallThickness/2/2
					}
					if (fields.leftExternal.value == true) {
						y_size = wallHeight + tileThickness
						y_shift = -tileThickness/2
					}
				>%
					Transform {
						translation %<= modelNumber(-.15 * scaleX) >% %<= modelNumber(y_shift * scaleY) >% %<= modelNumber(z_shift * scaleZ) >%
						rotation 0 1 0 1.570796
						children [
									Shape {
										appearance Appearance {
											material Material {
												diffuseColor 0.2 0.466667 0.521569
											}
										}
										geometry DEF BACKWALLBOX Box {
											size %<= modelNumber(z_size * scaleX) >% %<= modelNumber(y_size * scaleY) >% %<= modelNumber(wallThickness * scaleZ) >%
										}
										isPickable  FALSE
									}
								]
					}
				%<}>%
				%<if (fields.trap.value == true) {>%

							DEF FLOOR Transform {
								translation 0 %<= modelNumber(-0.205 * scaleY) >% 0
								children [
									Shape {
										appearance Appearance {
											material Material {
												diffuseColor 0.3 0.3 0.3
											}
										}
										geometry DEF FLOORBOX Box {
											size %<= modelNumber(0.3 * scaleX) >% %<= modelNumber(0.02 * scaleY) >% %<= modelNumber(0.3 * scaleZ) >%
										}
										isPickable  FALSE
									}
								]
							}
							Transform {
							  translation 0 %<= modelNumber(-0.1350125 * scaleY) >% %<= modelNumber(-0.13 * scaleZ) >%
							  rotation 0 1 0 -1.5707953071795862
							  children [
								Shape {
								  appearance DEF TRAPAPP Appearance {
									material Material {
									  diffuseColor 0.05 0.05 0.05
									  shininess 0.8
									}
								  }
								  geometry DEF TRAPEDGEBOX Box {
									size %<= modelNumber(0.04 * scaleX) >% %<= modelNumber(0.12 * scaleY) >% %<= modelNumber(0.3 * scaleZ) >%
								  }
								  isPickable  FALSE
								}
							  ]
							}
							Transform {
							  translation 0 %<= modelNumber(-0.1350125 * scaleY) >% %<= modelNumber(0.13 * scaleZ) >%
							  rotation 0 1 0 -1.5707953071795862
							  children [
								Shape {
								  appearance USE TRAPAPP
								  geometry DEF TRAPEDGEBOX Box {
									size %<= modelNumber(0.04 * scaleX) >% %<= modelNumber(0.12 * scaleY) >% %<= modelNumber(0.3 * scaleZ) >%
								  }
								  isPickable  FALSE
								}
							  ]
							}
							Transform {
							  translation %<= modelNumber(-0.13 * scaleY) >% %<= modelNumber(-0.1350125 * scaleY) >% 0
							  rotation 0 1 0 3.14159
							  children [
								Shape {
								  appearance USE TRAPAPP
								  geometry DEF TRAPEDGEBOX Box {
									size %<= modelNumber(0.04 * scaleX) >% %<= modelNumber(0.12 * scaleY) >% %<= modelNumber(0.3 * scaleZ) >%
								  }
								  isPickable  FALSE
								}
							  ]
							}
							Transform {
							  translation %<= modelNumber(0.13 * scaleY) >% %<= modelNumber(-0.1350125 * scaleY) >% 0
							  rotation 0 1 0 3.14159
							  children [
								Shape {
								  appearance USE TRAPAPP
								  geometry DEF TRAPEDGEBOX Box {
									size %<= modelNumber(0.04 * scaleX) >% %<= modelNumber(0.12 * scaleY) >% %<= modelNumber(0.3 * scaleZ) >%
								  }
								  isPickable  FALSE
								}
							  ]
							}
				%<}>%
				%<if (fields.curveDir.value > 0) {>%
					curvedWall {
						rot %<= modelNumber(fields.curveDir.value) >%
						isHalf %<= modelNumber(fields.isHalf.value && "TRUE" || "FALSE") >%
						xScale %<= modelNumber(scaleX) >%
						yScale %<= modelNumber(scaleY) >%
						zScale %<= modelNumber(scaleZ) >%
					}
				%<}>%
				%<if (fields.obstacle.value == true) {>%
					%<
						const clamp = (x, h, l) => {
                        if (x > h) { return h; }
                        else if (x < l) { return l; }
                        return x;
                    };

						obs_xoff = clamp(fields.obstacleOffset.value.x, .15, -.15)
						obs_yoff = clamp(fields.obstacleOffset.value.y, .15, -.15)

					>%
					DEF OBSTACLE Transform {
						translation %<= modelNumber(obs_xoff * scaleX) >% 0 %<= modelNumber(obs_yoff * scaleZ) >%
						rotation IS obstacleRotation
						children [
							Shape {
								appearance Appearance {
									material Material {
									diffuseColor 0.45 0.45 0.45
									}
								}
								geometry DEF OBSTACLEBOX Box {
									size %<= modelNumber(0.1 * scaleX) >% %<= modelNumber(0.18 * scaleY) >% %<= modelNumber(0.084 * scaleZ) >%
								}
							}
						]
					}
				%<}>%
			  ]
		  }
	        ]
				%<if (!(fields.topWall.value == 0) || !(fields.rightWall.value == 0) || !(fields.bottomWall.value==0) || !(fields.leftWall.value==0) || !(fields.floor.value==false)) {>%
					boundingObject USE TILE_SHAPES_GROUP
				%<}>%
      }
}
