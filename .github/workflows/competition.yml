name: 2027 competition qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  competition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '3.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install official Linux R2025a
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/cyberbotics/webots/releases/download/R2025a/webots_2025a_amd64.deb --output /tmp/webots.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/webots.deb xvfb libgl1-mesa-dri
          echo 'WEBOTS_HOME=/usr/local/webots' >> "$GITHUB_ENV"
      - name: Install official Windows R2025a
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe -OutFile "$env:RUNNER_TEMP/webots.exe"
          $install = Start-Process "$env:RUNNER_TEMP/webots.exe" -ArgumentList '/SUPPRESSMSGBOXES','/VERYSILENT','/NOCANCEL','/NORESTART','/DIR=C:\webots' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Webots installer failed: $($install.ExitCode)" }
          'WEBOTS_HOME=C:\webots' >> $env:GITHUB_ENV
      - name: Install Windows software renderer
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f
        with:
          version: '24.2.1'
          build-type: 'release-mingw'
      - run: python -m pip install -r requirements.txt
      - name: Check scoring and battery boundaries
        run: |
          python tests/test_rules_2027.py game/controllers/MainSupervisor
          python tests/test_battery_2027.py game/controllers/MainSupervisor
          python tests/test_zero_padding_map.py game/controllers/MainSupervisor
      - name: Run Linux competition including normal Docker controller
        if: runner.os == 'Linux'
        run: python tests/webots/run_competition.py --docker
      - name: Run Windows competition
        if: runner.os == 'Windows'
        run: python tests/webots/run_competition.py
      - name: Save competition results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: competition-${{ runner.os }}
          path: |
            validation/competition/results/
            validation/competition/remote-*.txt
            validation/competition/webots.log
          retention-days: 14
