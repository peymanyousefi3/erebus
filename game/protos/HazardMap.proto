#VRML_SIM R2025a utf8
# template language: javascript
# tags: static
PROTO HazardMap [
    field SFVec3f    translation       0 0 0
    field SFRotation rotation          0 0 0 0
    field SFBool     found             FALSE
    field SFString   name              "Hazard Map"
    field SFString   type              "F"
    field SFInt32    scoreWorth        10
]
{
%<
// Preserve the original model geometry precision after template conversion.
function modelNumber(value) {
  return typeof value === "number" ? Number(value.toPrecision(14)) : value;
}
>%

    %<
        const names = {O: 'placard-5.2-organic-peroxide', F: 'placard-2-flammable-gas', P: 'placard-6-poison', C: 'placard-8-corrosive'};
        const filename = './textures/' + (names[fields.type.value] || names.F) + (fields.found.value ? '_found' : '') + '.png';
    >%
    Pose {
        translation IS translation
        rotation IS rotation
        children [
            Solid {

                translation 0 0 0
                rotation 0 1 0 3.14159
                children [
                    Shape {
                        appearance Appearance {
                            texture DEF human0texture ImageTexture {
                                url [ "%<= modelNumber(filename) >%" ]
                            }
                        }
                        geometry DEF VICTIMPLANE Plane {
                            size 0.016 0.016
                        }
                        isPickable  FALSE
                    }
                ]
                name IS name
            }
        ]
    }
}

