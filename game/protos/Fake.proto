#VRML_SIM R2025a utf8
# template language: javascript

# tags: static
PROTO Fake [
	field SFVec3f    translation       0 0 0
	field SFRotation rotation          0 0 0 0
	field SFString   name              "Fake"
	field SFString   type              "omega"
	field SFInt32    scoreWorth        10
]
{
%<
// Preserve the original model geometry precision after template conversion.
function modelNumber(value) {
  return typeof value === "number" ? Number(value.toPrecision(14)) : value;
}
>%

	%<
		let filename = "";
		if (fields.type.value === "omega") {
			filename = "./stl/U.stl";
		} else if (fields.type.value === "phi") {
			filename = "./stl/S.stl";
		} else if (fields.type.value === "psi") {
			filename = "./stl/H.stl";
		}
	>%

	Pose {
		translation IS translation
		rotation IS rotation
		children [
			Solid {
				translation 0.0 0.0 0
				rotation 0 1 0 3.14159
				children [
					Solid {
						translation 0 0 0
						children [
							Shape {
								appearance PBRAppearance {
									metalness 0
									emissiveColor 1 1 1
								}
								geometry Box {
									size 0.02 0.02 0.0002
								}
							}
						]
					}
					Transform {
						scale 0.001 0.001 0.001
						translation 0 0 0
						children [
							Shape {
								appearance PBRAppearance {
									IBLStrength 0
									emissiveIntensity 0
								}
								geometry Mesh {
									url [ "%<= modelNumber(filename) >%" ]
								}
							}
						]
					}
				]
				name IS name

			}
		]
	}

}

