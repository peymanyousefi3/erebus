<!doctype html>
<!-- Erebus interface customizations by Peyman Yousefi. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map review</title><link rel="stylesheet" href="MapReview.css"></head><body><main>
<header><h1>Map review</h1><span id="submission"></span></header>
<section class="metrics" aria-label="Map result"><span>Correctness <strong id="correctness">—</strong></span><span><i class="swatch wrong"></i><b id="incorrect">—</b> incorrect</span><span><b id="correct">—</b> correct</span><span><b id="ignored">—</b> ignored</span><span id="outsideSummary" hidden><i class="swatch extra"></i><b id="outsideCount">0</b> outside comparison (not scored)</span></section>
<nav aria-label="Map controls"><div class="group"><button id="left" disabled>Rotate left 90°</button><button id="right" disabled>Rotate right 90°</button></div><div class="group"><button id="out" disabled aria-label="Zoom out">−</button><output id="zoom">100%</output><button id="in" disabled aria-label="Zoom in">+</button><button id="fit" disabled>Fit map</button></div><div class="group exports"><button id="raw" disabled title="Save the full original robot matrix, including cells outside the displayed area">Save matrix</button><button id="image" disabled>Save PNG</button></div></nav>
<section class="map-panel" aria-label="Interactive map"><canvas id="map" tabindex="0" role="img" aria-label="Submitted map. Click a cell for its reported and correct values. Plus and minus zoom, R rotates, Home fits the map, and arrow keys pan."></canvas><p id="empty">Waiting for an evaluated map.</p><span id="orientation">0°</span>
<section id="cellPopup" role="dialog" aria-labelledby="cell-title" tabindex="-1" hidden><div class="popup-title"><h2 id="cell-title">Cell</h2><button id="closeCell" aria-label="Close cell details" title="Close">×</button></div><p id="coordinates"></p><div class="answers"><div><h3>Robot reported</h3><p id="reported"></p></div><div><h3>Correct answer</h3><p id="expected"></p></div></div><p id="status"></p><p id="cell-help"></p></section>
</section>
<footer><span id="notice" role="status">Click a cell for details. Drag to pan.</span><span id="selection" aria-live="polite"></span><span class="fading-key"><i class="swatch wrong"></i>Incorrect <i class="swatch extra"></i>Outside comparison <i class="swatch faded"></i>Correct / ignored</span></footer>
</main><script src="MapReview.js"></script></body></html>
