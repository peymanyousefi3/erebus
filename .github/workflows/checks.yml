name: Customization checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Native test group
        type: choice
        options: [all, competition, portable-only, legacy-model, scoring, full-match, real-time-limit, natural-depletion, remote-docker]
        default: all
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  regression:
    if: inputs.test_mode != 'competition'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_customizations.py
      - run: node tests/test_interface_contract.cjs
      - run: node tests/test_access_audit_panel.cjs
  webots-r2025a:
    if: (github.ref == 'refs/heads/2027_webots2025a' || github.event_name == 'pull_request') && inputs.test_mode != 'portable-only' && inputs.test_mode != 'competition'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      WEBOTS_HOME: /usr/local/webots
      LIBGL_ALWAYS_SOFTWARE: '1'
      EREBUS_TEST_CLOSE_ON_COMPLETE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install official R2025a and virtual display
        run: |
          sudo apt-get update
          curl --fail --location --retry 3 https://github.com/cyberbotics/webots/releases/download/R2025a/webots_2025a_amd64.deb --output /tmp/webots.deb
          sha256sum /tmp/webots.deb
          sudo apt-get install -y /tmp/webots.deb xvfb libgl1-mesa-dri
          rm -f /tmp/webots.deb
          python -m pip install -r requirements.txt
      - name: Exercise all fields, rules, sensors, replays and Docker
        run: |
          test_mode="${{ inputs.test_mode || 'all' }}"
          if [ "$test_mode" = all ]; then
            python tests/webots/prepare.py --docker
          else
            python tests/webots/prepare.py --docker --only-mode "$test_mode"
          fi
          first_world=$(python -c 'import json; print(json.load(open("validation/release/queue.json"))["jobs"][0]["world"])')
          xvfb-run -a -s '-screen 0 1280x720x24' "$WEBOTS_HOME/webots" --batch --mode=fast --no-rendering --stdout --stderr --port=1255 "validation/release/runtime/game/worlds/$first_world.wbt" > validation/webots-r2025a.log 2>&1 &
          webots_pid=$!
          python tests/webots/monitor.py --output validation/release --webots-home "$WEBOTS_HOME" --port 1255 --webots-pid "$webots_pid" --engine-log validation/webots-r2025a.log
          wait "$webots_pid"
          if rg '^ERROR:' validation/webots-r2025a.log; then exit 1; fi
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webots-r2025a-validation
          path: |
            validation/release/results/
            validation/release/remote-*.txt
            validation/webots-r2025a.log
          retention-days: 14

  competition:
    if: github.event_name == 'workflow_dispatch' && inputs.test_mode == 'competition'
    uses: ./.github/workflows/competition.yml
