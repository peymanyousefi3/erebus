#VRML_SIM R2025a utf8
# template language: javascript

PROTO obstacle[
    field SFVec3f    translation       0 0 0
    field SFRotation rotation          0 0 0 0
    field SFFloat width 0.1
    field SFFloat depth 0.1
    field SFFloat height 0.1
    field SFString id ""
    field SFBool rectangular TRUE
    field SFBool cylindrical FALSE
    field SFBool conical FALSE
    field SFBool spherical FALSE
    field SFBool physics FALSE
    field SFBool displayClearance FALSE
    hiddenField SFFloat clearanceSize 0.2
    hiddenField SFFloat scale 0.4
]

{
%<
// Preserve the original model geometry precision after template conversion.
function modelNumber(value) {
  return typeof value === "number" ? Number(value.toPrecision(14)) : value;
}
>%

    DEF OBSTACLE Pose {

        %<
            const w = fields.width.value;
            const h = fields.height.value;
            const d = fields.depth.value;
            const r = Math.sqrt(((d / 2) ** 2) + ((w / 2) ** 2));
            const id = fields.id.value;
            const offset = fields.clearanceSize.value * fields.scale.value;
        >%

        translation IS translation
        rotation IS rotation

        children[
            Transform {
                rotation 1 0 0 -1.56826
                children [
                    %< if (fields.rectangular.value === true) { >%
                        DEF CUBE Solid {
                            translation 0 0 0
                            children[
                                Shape {

                                    appearance Appearance {
                                        material Material {
                                            diffuseColor 0.45 0.45 0.45
                                        }
                                    }

                                    geometry DEF CUBESHAPE Box {
                                        size %<= modelNumber(w) >% %<= modelNumber(h) >% %<= modelNumber(d) >%
                                    }

                                }
                            ]

                            %< if (fields.physics.value === true) { >%
                                physics Physics {

                                }
                            %< } >%

                            name "rectangleObstacle%<= modelNumber(id) >%"
                            boundingObject USE CUBESHAPE
                        }
                    %< } >%

                    %< if (fields.cylindrical.value === true) { >%
                        DEF CYLINDER Solid{
                            translation 0 0 0
                            children[
                                Shape {

                                    appearance Appearance {
                                        material Material {
                                            diffuseColor 0.45 0.45 0.45
                                        }
                                    }

                                    geometry DEF CYLINDERSHAPE Cylinder {
                                        height %<= modelNumber(h) >%
                                        radius %<= modelNumber(r) >%
                                    }

                                }
                            ]

                            %< if (fields.physics.value === true) { >%
                                physics Physics {

                                }
                            %< } >%

                            name "cylinderObstacle%<= modelNumber(id) >%"
                            boundingObject USE CYLINDERSHAPE
                        }
                    %< } >%

                    %< if (fields.conical.value === true) { >%
                        DEF CONE Solid{
                            translation 0 0 0
                            children[
                                Shape {

                                    appearance Appearance {
                                        material Material {
                                            diffuseColor 0.45 0.45 0.45
                                        }
                                    }

                                    geometry DEF CONESHAPE Cone {
                                        height %<= modelNumber(h) >%
                                        bottomRadius %<= modelNumber(r) >%
                                    }

                                }
                            ]

                            %< if (fields.physics.value === true) { >%
                                physics Physics {

                                }
                            %< } >%

                            name "coneObstacle%<= modelNumber(id) >%"
                            boundingObject DEF CYLINDERBOUNDS Cylinder {
                                height %<= modelNumber(h) >%
                                radius %<= modelNumber(r) >%
                            }
                        }
                    %< } >%

                    %< if (fields.spherical.value === true) { >%
                        DEF SPHERE Solid{
                            translation 0 0 0
                            children[
                                Shape {

                                    appearance Appearance {
                                        material Material {
                                            diffuseColor 0.45 0.45 0.45
                                        }
                                    }

                                    geometry DEF SPHERESHAPE Sphere {
                                        radius %<= modelNumber(h / 2) >%
                                        subdivision 5
                                    }

                                }
                            ]

                            %< if (fields.physics.value === true) { >%
                                physics Physics {

                                }
                            %< } >%

                            name "obstacleSphere%<= modelNumber(id) >%"
                            boundingObject USE SPHERESHAPE
                        }
                    %< } >%

                    %< if (fields.displayClearance.value === true && (fields.rectangular.value === true || fields.cylindrical.value === true || fields.conical.value === true || fields.spherical.value === true)) { >%
                        DEF CLEARANCE Shape {
                            appearance Appearance {
                                material Material {
                                    diffuseColor 0.8 0 0
                                    transparency 0.5
                                }
                            }

                            geometry DEF CYLINDERSHAPE Cylinder {
                                height %<= modelNumber(h + 0.005) >%
                                radius %<= modelNumber(r + offset) >%
                            }
                        }
                    %< } >%
                ]
            }
        ]

    }
}
